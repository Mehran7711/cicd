
name: Build and Deploy Spring Boot

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'mvnw'
      - '.mvn/**'
      - 'Dockerfile'
      - '.github/workflows/build-deploy.yml'

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test and package
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/mehran7711/cicd:sha-${{ github.sha }}

      - name: Install yq
        run: |
          sudo curl -fsSL \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64 \
            -o /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm image tag
        env:
          IMAGE_NAME: ghcr.io/mehran7711/cicd
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          yq -i \
            '.image.repository = strenv(IMAGE_NAME) |
             .image.tag = strenv(IMAGE_TAG)' \
            helm/webapp/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/webapp/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm changes to commit"
          else
            git commit -m "chore(deploy): update image to ${IMAGE_TAG}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
