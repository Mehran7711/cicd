apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: "ghcr.io/mehran7711/webapp:latest"
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

